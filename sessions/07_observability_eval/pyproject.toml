[project]
name = "ae07-observability-eval"
version = "1.0.0"
description = "Agent Engineering · Session 07 lab: Observability and Evaluation Engineering"
requires-python = "==3.12.*"
# Exact versions the notebooks were run with.
dependencies = [
    "langchain==1.4.2",
    "langchain-openai==1.6.6",
    "langgraph==1.2.12",
    "python-dotenv==1.2.3",
    "tavily-python==0.8.4",
    "langfuse==5.0.2",
    "ipykernel==7.3.0",  # lets the IDE run the notebooks with this environment
]

[tool.uv]
package = false  # a folder of notebooks, not an installable package
