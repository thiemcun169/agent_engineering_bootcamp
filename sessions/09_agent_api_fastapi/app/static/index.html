<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Brief</title>
<!-- fonts with a Vietnamese subset (Source Serif 4, Inter, JetBrains Mono); offline the CSS falls back to Noto -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<link rel="stylesheet" href="/static/app.css?v=3">
</head>
<body>
<!-- Sign in / create account: POST /auth/token (form) returns a JWT; POST /auth/signup creates the account -->
<section id="signin" class="signin">
  <div class="signin-card">
    <div class="mark">✳</div>
    <h1>Research Brief</h1>
    <div class="tabs" role="tablist">
      <button id="tab-signin" class="tab active" type="button">Sign in</button>
      <button id="tab-signup" class="tab" type="button">Create account</button>
    </div>
    <form id="auth-form" class="auth-form">
      <input id="name" placeholder="Your name" autocomplete="name" hidden>
      <input id="username" placeholder="Username" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button id="auth-submit" class="primary" type="submit">Sign in</button>
    </form>
    <p id="signin-error" class="error"></p>
    <p class="muted hint">Usernames: lowercase letters, digits, _ · passwords: 8+ characters.</p>
  </div>
</section>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="mark">✳</span> Research Brief</div>
    <button id="new" class="new-chat">＋ New brief</button>
    <div class="section-label">Recents</div>
    <nav id="threads" class="threads"></nav>
    <div class="account">
      <span id="avatar" class="avatar"></span>
      <span id="who" class="who"></span>
      <button id="signout" class="link">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div id="empty" class="empty">
      <h2 id="greeting" class="greeting"></h2>
      <p class="muted">Ask for a short, cited research brief. You approve it before it is saved.</p>
    </div>
    <div id="conversation" class="conversation" hidden></div>
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="How can I help you today?"></textarea>
      <button id="send" class="send" type="submit" aria-label="Send" disabled>↑</button>
    </form>
    <p class="footnote">The agent searches the web; check the sources in each brief.</p>
  </main>
</div>
<script src="/static/app.js?v=3"></script>
</body>
</html>
