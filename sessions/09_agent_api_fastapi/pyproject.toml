[project]
name = "ae09-agent-api-fastapi"
version = "1.0.0"
description = "Agent Engineering · Session 09 lab: Agent API Engineering with FastAPI"
requires-python = "==3.12.*"
# Exact versions the notebooks were run with.
dependencies = [
    "langchain==1.4.2",
    "langchain-openai==1.6.6",
    "langgraph==1.2.12",
    "deepagents==0.7.19",
    "python-dotenv==1.2.3",
    "tavily-python==0.8.4",
    "fastapi[standard]==0.162.0",  # native Server-Sent Events (fastapi.sse) since 0.135; [standard] adds the fastapi CLI
    "uvicorn==0.54.0",        # the ASGI server behind `fastapi run`
    "pydantic-settings==2.16.2",  # Settings from environment variables and .env
    "langgraph-checkpoint-sqlite==3.1.1",  # threads survive a server restart (output/checkpoints.db)
    "httpx==0.28.1",          # the notebooks call the API with it
    "ipykernel==7.3.0",  # lets the IDE run the notebooks with this environment
]

[tool.uv]
package = false  # the app/ package is run in place by the FastAPI CLI

[tool.fastapi]
entrypoint = "app.main:app"  # `fastapi dev` / `fastapi run` find the app here
