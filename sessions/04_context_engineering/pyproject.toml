[project]
name = "ae04-context-engineering"
version = "1.0.0"
description = "Agent Engineering · Session 04 lab: Context Engineering with Prompts, Skills and Memory"
requires-python = "==3.12.*"
# Exact versions the notebooks were run with.
dependencies = [
    "langchain==1.4.2",
    "langchain-openai==1.6.6",
    "langgraph==1.2.12",
    "deepagents==0.7.19",
    "python-dotenv==1.2.3",
    "langgraph-checkpoint-sqlite==3.1.1",
    "tavily-python==0.8.4",
    "tiktoken==0.14.0",  # token counts in notebooks/utils.py
    "ipykernel==7.3.0",  # lets the IDE run the notebooks with this environment
]

[tool.uv]
package = false  # a folder of notebooks, not an installable package
