[project]
name = "ae03-tool-mcp"
version = "1.0.0"
description = "Agent Engineering · Session 03 lab: Tool and MCP Engineering"
requires-python = "==3.12.*"
# Exact versions the notebooks were run with.
dependencies = [
    "langchain[mcp]==1.4.2",
    "langchain-openai==1.6.6",
    "langgraph==1.2.12",
    "tavily-python==0.8.4",
    "python-dotenv==1.2.3",
    "fastmcp==4.0.10",
    "py-key-value-aio[disk]==0.4.6",  # DiskStore: the OAuth token store of the FastMCP docs
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ngrok==1.7.0",  # public URL for the MCP server (Python SDK, no ngrok binary needed)
    "ipykernel==7.3.0",  # lets the IDE run the notebooks with this environment
]

[tool.uv]
package = false  # a folder of notebooks, not an installable package
